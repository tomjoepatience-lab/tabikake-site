<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% else %}歩数番付{% endif %}</title>
<meta name="description" content="{{ page.description | default: '毎日の歩数を大相撲の取組に見立てて、序ノ口から横綱を目指す歩数アプリ「歩数番付」' }}">
<link rel="icon" href="/hosu-banzuke/icon.png">
<meta name="theme-color" content="#162340">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#162340; --navy-mid:#243055; --gold:#c9a227; --gold-light:#f5e199; --gold-pale:#fffbea;
  --red:#c0392b; --ink:#1c1c1e; --gray:#6b7280; --bg:#f8f6f1; --paper:#f6efcf; --white:#fff; --line:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;line-height:1.9;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:0 0 60px}
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-mid) 70%,#3a2a1a 100%);color:#fff;
  padding:44px 24px 36px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 24px,var(--red) 24px 48px)}
.hero img{width:104px;height:104px;border-radius:24px;box-shadow:0 8px 20px rgba(0,0,0,.35);border:3px solid var(--gold)}
.hero .kicker{font-family:'Zen Maru Gothic',sans-serif;font-size:13px;letter-spacing:.3em;color:var(--gold-light);margin:18px 0 6px}
.hero h1{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:40px;margin:0;letter-spacing:.12em}
.hero p{margin:10px 0 0;color:rgba(255,255,255,.8);font-size:15px}
.store{display:inline-block;margin-top:20px;background:var(--gold);color:var(--navy);text-decoration:none;
  font-family:'Zen Maru Gothic',sans-serif;font-weight:900;padding:12px 28px;border-radius:999px;
  box-shadow:0 6px 14px rgba(0,0,0,.25);letter-spacing:.05em}
.store:hover{background:var(--gold-light)}
main{padding:8px 20px 0}
main > img:first-child, main h1{display:none}
main > p:first-of-type{text-align:center;font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:18px;color:var(--navy);margin:28px 0 8px}
main h2{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:20px;color:#fff;background:var(--navy);
  margin:40px 0 16px;padding:8px 18px;border-left:8px solid var(--gold);border-radius:0 10px 10px 0;letter-spacing:.08em}
main h3{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:16px;margin:24px 0 6px;color:var(--navy);padding-left:14px;border-left:4px solid var(--red)}
main ul{padding-left:0;list-style:none}
main ul li{background:var(--paper);border-radius:10px;padding:10px 16px 10px 44px;margin:8px 0;position:relative;
  box-shadow:0 2px 6px rgba(22,35,64,.08)}
main ul li::before{content:"○";position:absolute;left:14px;top:10px;color:var(--red);font-weight:700;font-size:18px}
main a{color:var(--navy);font-weight:700;text-decoration:none;border-bottom:2px solid var(--gold-light)}
main a:hover{border-bottom-color:var(--gold)}
main strong{background:linear-gradient(transparent 60%,var(--gold-light) 60%);font-weight:700}
main p{margin:12px 0}
.site-footer{margin-top:56px;text-align:center;color:var(--gray);font-size:13px;padding:0 20px}
.site-footer a{color:var(--gray)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="/hosu-banzuke/icon.png" alt="歩数番付 アイコン">
    <div class="kicker">歩いて番付を駆け上がる</div>
    <h1>歩数番付</h1>
    <p>今日の歩数が、今日の取組。</p>
    <a class="store" href="https://apps.apple.com/app/id6816940925">App Store で入手</a>
  </div>
  <main>
  {{ content }}
  </main>
  <footer class="site-footer">
    <p><a href="mailto:tomjoepatience@gmail.com">tomjoepatience@gmail.com</a> ・ <a href="/hosu-banzuke/privacy.html">プライバシーポリシー</a></p>
    <p>&copy; {{ 'now' | date: "%Y" }} tomjo</p>
  </footer>
</div>
</body>
</html>
