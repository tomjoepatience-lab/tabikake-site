<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% else %}いってきます{% endif %}</title>
<meta name="description" content="{{ page.description | default: '忘れ物をなくすための持ち物チェックアプリ「いってきます」' }}">
<link rel="icon" href="/ittekimasu/icon.png">
<meta name="theme-color" content="#F3F1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EA; --ink:#38332C; --sub:#9A8F81; --accent:#4C51E0;
  --paper-y:#FFF3C4; --tape-y:#F4C430; --paper-p:#FFE3ED; --tape-p:#FF7FAA;
  --paper-g:#E7F4DC; --tape-g:#7BC86C; --paper-b:#E3ECFF; --tape-b:#5B95E8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans',sans-serif;
  line-height:1.85;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
.hero{background:#fff;border-radius:20px;padding:28px 24px;text-align:center;
  box-shadow:0 10px 30px rgba(56,51,44,.08);position:relative;margin-bottom:34px}
.hero::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:96px;height:20px;background:var(--tape-y);opacity:.85;border-radius:3px}
.hero img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 16px rgba(56,51,44,.18)}
.hero h1{font-weight:900;font-size:26px;margin:14px 0 4px;letter-spacing:.02em}
.hero p{color:var(--sub);margin:0;font-weight:500}
.store{display:inline-block;margin-top:16px;background:var(--accent);color:#fff;text-decoration:none;
  font-weight:700;padding:12px 26px;border-radius:999px;box-shadow:0 6px 14px rgba(76,81,224,.3)}
.store:hover{opacity:.9}
main h1{display:none}
main h2{position:relative;font-size:19px;font-weight:900;margin:40px 0 14px;padding:10px 16px 10px 18px;
  background:var(--paper-y);border-radius:4px 14px 14px 4px;transform:rotate(-.6deg);
  box-shadow:0 4px 10px rgba(56,51,44,.08);border-left:6px solid var(--tape-y)}
main h2:nth-of-type(4n+2){background:var(--paper-p);border-left-color:var(--tape-p)}
main h2:nth-of-type(4n+3){background:var(--paper-g);border-left-color:var(--tape-g)}
main h2:nth-of-type(4n){background:var(--paper-b);border-left-color:var(--tape-b)}
main h3{font-size:16px;font-weight:700;margin:26px 0 8px;color:var(--ink)}
main h3::before{content:"◦ ";color:var(--accent);font-weight:900}
main ul{padding-left:0;list-style:none}
main ul li{background:#fff;border-radius:12px;padding:10px 14px 10px 40px;margin:8px 0;position:relative;
  box-shadow:0 2px 6px rgba(56,51,44,.06)}
main ul li::before{content:"";position:absolute;left:14px;top:16px;width:14px;height:14px;
  border:2.5px solid var(--tape-g);border-radius:50%}
main a{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:2px solid #DDE0FA}
main a:hover{border-bottom-color:var(--accent)}
main strong{background:linear-gradient(transparent 62%,var(--paper-y) 62%);font-weight:900}
main hr{border:none;border-top:2px dashed #DFD9CC;margin:36px 0}
main p{margin:12px 0}
.site-footer{margin-top:56px;text-align:center;color:var(--sub);font-size:13px}
.site-footer a{color:var(--sub)}
@media (prefers-color-scheme: dark){ /* あえてライト固定（アプリがライト固定のため） */ }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="/ittekimasu/icon.png" alt="いってきます アイコン">
    <h1>いってきます</h1>
    <p>忘れ物、もう二度と。</p>
    <a class="store" href="https://apps.apple.com/app/id6779500770">App Store で入手</a>
  </div>
  <main>
  {{ content }}
  </main>
  <footer class="site-footer">
    <p><a href="mailto:tomjoepatience@gmail.com">tomjoepatience@gmail.com</a> ・ <a href="/ittekimasu/privacy">プライバシーポリシー</a></p>
    <p>&copy; {{ 'now' | date: "%Y" }} tomjo</p>
  </footer>
</div>
</body>
</html>
